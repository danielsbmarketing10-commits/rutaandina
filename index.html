<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f4ee"><title>Ruta Andina</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header class="topbar"><a class="brand" href="#" aria-label="Ruta Andina"><span class="brand-mark">↗</span><span>ruta<span class="brand-light">andina</span></span></a><div class="header-right"><span class="save-state"><i></i><span id="saveText">Guardado</span></span><button class="icon-button" id="locateBtn" aria-label="Centrar en mi ubicación" title="Mi ubicación">◎</button></div></header>
<section class="map-wrap" aria-label="Mapa de ruta"><div id="map"></div><form class="search-box" id="searchForm" role="search"><span class="search-icon" aria-hidden="true">⌕</span><input id="placeSearch" type="search" placeholder="Buscar destino o toca el mapa…" autocomplete="off" aria-label="Buscar destino"><button type="submit" aria-label="Buscar">↵</button><div class="search-results" id="searchResults" role="listbox" aria-label="Resultados de búsqueda"></div></form><div class="map-caption"><span class="live-dot"></span><span id="mapStatus">La Paz, Bolivia</span></div><div class="distance-pill"><span class="distance-value" id="distance">0,00</span><span>km</span></div><div class="zoom-hint" id="gpsHint">Activa el GPS para registrar tu recorrido</div></section>
<section class="route-panel"><div class="route-topline"><div class="route-heading"><span class="eyebrow">TU RECORRIDO</span><span class="route-state" id="routeState">Listo para salir</span></div><div class="top-tools"><div class="point-count" id="pointCount">0 puntos</div><button class="routes-button" id="openRoutes" type="button">Mis rutas</button></div></div><div class="route-progress" aria-hidden="true"><span id="progressLine"></span></div><div class="route-meta"><div class="meta-point"><span class="point-icon start-icon"></span><div><small>PARTIDA</small><strong id="startLabel">—</strong></div></div><div class="meta-point"><span class="point-icon finish-icon"></span><div><small>LLEGADA</small><strong id="finishLabel">—</strong></div></div></div><div class="actions"><button class="primary-button" id="mainAction"><span class="action-symbol">▶</span><span>Iniciar recorrido</span></button><button class="stop-button" id="stopAction" title="Añadir una parada" aria-label="Añadir parada"><span>＋</span><small>Parada</small></button><button class="arrival-button" id="arrivalAction" title="Marcar llegada" aria-label="Marcar llegada"><span>◆</span><small>Llegada</small></button><button class="pdf-button" id="pdfAction" title="Exportar a PDF" aria-label="Exportar ruta a PDF"><span>↓</span><small>PDF</small></button></div><div class="utility-row"><span class="offline-note" id="connectionStatus">● En línea · El trazado se guarda en este dispositivo</span><button id="clearAction" class="text-button">Nueva ruta</button></div><div class="toast" id="toast" role="status" aria-live="polite"></div></section><dialog class="routes-dialog" id="routesDialog" aria-labelledby="routesTitle"><div class="dialog-head"><div><span class="eyebrow">TU BIBLIOTECA</span><h2 id="routesTitle">Mis rutas</h2></div><button class="dialog-close" id="closeRoutes" type="button" aria-label="Cerrar">×</button></div><form class="route-save-form" id="saveRouteForm"><label for="routeNameInput">Guardar recorrido actual</label><div class="save-fields"><input id="routeNameInput" maxlength="60" placeholder="Ej. Valle de las Ánimas" autocomplete="off"><button id="saveRouteButton" type="submit">Guardar</button></div></form><div class="saved-routes" id="savedRoutesList"></div></dialog><footer class="map-credit">© OpenStreetMap · Ruta guardada automáticamente</footer></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script type="module" src="app.js"></script></body></html>
